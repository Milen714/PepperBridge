services:
  # Registers amd64 emulation with the host kernel on ARM64 systems such as Pi.
  # This needs privileged access and completes before the bridge starts.
  binfmt:
    image: tonistiigi/binfmt:latest
    privileged: true
    command: ["--install", "amd64"]
    restart: "no"

  pepper-bridge:
    platform: linux/amd64
    build: .
    image: pepper-bridge
    container_name: pepper-bridge
    restart: unless-stopped
    depends_on:
      binfmt:
        condition: service_completed_successfully
    ports:
      - "${BRIDGE_PORT:-9999}:9999"
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - "audio"
    volumes:
      - ".:/opt/pepper-bridge"
    environment:
      PEPPER_IP: ${PEPPER_IP:-192.168.1.122}
      ESP32_IP: ${ESP32_IP:-192.168.1.150}
      ESP32_PORT: ${ESP32_PORT:-50005}
      PEPPER_LEDS_ENABLED: ${PEPPER_LEDS_ENABLED:-true}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 9999
      AUDIO_SOURCE: ${AUDIO_SOURCE:-rpi_i2s}
      I2S_MIC_GAIN: ${I2S_MIC_GAIN:-2.0}
      I2S_MIC_DEVICE_INDEX: ${I2S_MIC_DEVICE_INDEX:-}
