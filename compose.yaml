services:
  binfmt:
    image: tonistiigi/binfmt:latest
    privileged: true
    command: ["--install", "amd64"]
    restart: "no"

  pi-audio:
    build: ./pi_audio
    image: pepper-pi-audio
    container_name: pi-audio
    restart: unless-stopped
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - "audio"
    volumes:
      - "./pi_audio/server.py:/app/server.py:ro"
    environment:
      AUDIO_PORT: ${AUDIO_PORT:-50005}
      AUDIO_DEVICE: ${AUDIO_DEVICE:-}
      SAMPLE_RATE: 16000
      CHUNK_SAMPLES: 512
      MIC_GAIN: ${I2S_MIC_GAIN:-2.0}
  pepper-bridge:
    platform: linux/amd64
    build: .
    image: pepper-bridge
    container_name: pepper-bridge
    restart: unless-stopped
    depends_on:
      binfmt:
        condition: service_completed_successfully
      pi-audio:
        condition: service_started
    ports:
      - "${BRIDGE_PORT:-9999}:9999"
    volumes:
      - ".:/opt/pepper-bridge"
    environment:
      PEPPER_IP: ${PEPPER_IP:-192.168.1.122}
      ESP32_IP: ${ESP32_IP:-192.168.1.150}
      ESP32_PORT: ${ESP32_PORT:-50005}
      AUDIO_HOST: ${AUDIO_HOST:-pi-audio}
      AUDIO_PORT: ${AUDIO_PORT:-50005}
      PEPPER_LEDS_ENABLED: ${PEPPER_LEDS_ENABLED:-true}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 9999
